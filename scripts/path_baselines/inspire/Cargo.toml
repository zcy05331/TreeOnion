[package]
name = "inspire-path-adapter"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
poulpy-cpu-avx = { version = "0.7.0", features = ["enable-avx"], optional = true }
poulpy-cpu-avx512 = { version = "0.7.0", features = ["enable-avx512f"], optional = true }
poulpy-cpu-ref = "0.7.0"
poulpy-pir = { path = "../../../.benchmarks/inspire-path/poulpy-pir" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
avx2-fhe = ["dep:poulpy-cpu-avx"]
avx512-fhe = ["dep:poulpy-cpu-avx512"]

[patch.crates-io]
ptr_hash = { path = "../../../.benchmarks/inspire-path/poulpy-pir/vendor/ptr_hash" }
