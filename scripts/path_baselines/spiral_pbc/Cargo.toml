[package]
name = "spiral_pbc"
version = "0.1.0"
edition = "2021"
description = "Spiral PIR behind the OnionPIR cuckoo baseline's PBC instance and behind TreePIR's color buckets"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "spiral_pbc"
path = "src/main.rs"

[[bin]]
name = "treepir_spiral"
path = "src/bin/treepir_spiral.rs"

[dependencies]
# Complete spiral-rs (server + client); menonsamir/spiral-rs is a trimmed core
# for YPIR and points here for the working version.
spiral-rs = { git = "https://github.com/blyssprivacy/sdk", rev = "fdb7206517c249603b0c91b65f1f29f95272107c", features = ["server"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
debug = false
